<header class="site-header">
    <nav class="nav-container">
        <a href="{{ url_for('main.index') }}" class="site-logo">文化遗产档案系统</a>
        <ul class="nav-links">
            <li><a href="{{ url_for('main.index') }}">首页</a></li>
            <li><a href="{{ url_for('archives.list_archives') }}">档案</a></li>
            <li><a href="{{ url_for('categories.list_categories') }}">分类</a></li>
            <li><a href="{{ url_for('collections.list_collections') }}">合集</a></li>
            {% if current_user.is_authenticated %}
            <li><a href="{{ url_for('reports.generate') }}">报告</a></li>
            <li class="nav-user">
                <span>{{ current_user.display_name }}</span>
                <a href="{{ url_for('auth.logout') }}">退出</a>
            </li>
            {% else %}
            <li><a href="{{ url_for('auth.login') }}" class="btn btn-outline btn-sm">登录</a></li>
            <li><a href="{{ url_for('auth.register') }}" class="btn btn-primary btn-sm">注册</a></li>
            {% endif %}
        </ul>
    </nav>
</header>
