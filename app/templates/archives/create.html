{% extends "base.html" %}

{% block title %}新建档案 - 文化遗产档案系统{% endblock %}

{% block content %}
<div class="form-page">
    <h1>新建档案</h1>
    <form method="post" enctype="multipart/form-data" class="archive-form">
        <div class="form-group">
            <label for="title">标题 <span class="required">*</span></label>
            <input type="text" id="title" name="title" value="{{ data.get('title', '') }}" required>
        </div>
        <div class="form-group">
            <label for="category_id">分类</label>
            <select id="category_id" name="category_id">
                <option value="">请选择分类</option>
                {% for cat in categories %}
                <option value="{{ cat.id }}" {% if data.get('category_id') == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="era">年代</label>
                <input type="text" id="era" name="era" value="{{ data.get('era', '') }}" placeholder="如：唐代、明代">
            </div>
            <div class="form-group">
                <label for="location">地点</label>
                <input type="text" id="location" name="location" value="{{ data.get('location', '') }}" placeholder="如：北京、西安">
            </div>
        </div>
        <div class="form-group">
            <label for="description">详细描述</label>
            <textarea id="description" name="description" rows="6">{{ data.get('description', '') }}</textarea>
        </div>
        <div class="form-group">
            <label for="image">图片</label>
            <input type="file" id="image" name="image" accept="image/*">
        </div>
        <div class="form-group">
            <label for="status">状态</label>
            <select id="status" name="status">
                <option value="draft" {% if data.get('status', 'draft') == 'draft' %}selected{% endif %}>草稿</option>
                <option value="published" {% if data.get('status') == 'published' %}selected{% endif %}>已发布</option>
                <option value="archived" {% if data.get('status') == 'archived' %}selected{% endif %}>已归档</option>
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">创建</button>
            <a href="{{ url_for('archives.list_archives') }}" class="btn btn-outline">取消</a>
        </div>
    </form>
</div>
{% endblock %}
