{% extends "base.html" %} {% block title %}新建合集 - 文化遗产档案系统{%
endblock %} {% block content %}
<div class="form-page">
  <h1>新建合集</h1>
  <form method="post" class="archive-form">
    <div class="form-group">
      <label for="name">合集名称 <span class="required">*</span></label>
      <input
        type="text"
        id="name"
        name="name"
        value="{{ data.get('name', '') }}"
        required
      />
    </div>
    <div class="form-group">
      <label for="description">描述</label>
      <textarea id="description" name="description" rows="5">
{{ data.get('description', '') }}</textarea
      >
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">创建</button>
      <a
        href="{{ url_for('collections.list_collections') }}"
        class="btn btn-outline"
        >取消</a
      >
    </div>
  </form>
</div>
{% endblock %}
